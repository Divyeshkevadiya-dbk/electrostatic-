<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<div id="log"></div>
<script src="math_renderer.js"></script>
<script src="beee_course_data.js"></script>
<script>
  const log = document.getElementById('log');
  try {
    log.innerHTML += "<p>MathRenderer exists: " + (typeof MathRenderer !== 'undefined') + "</p>";
    log.innerHTML += "<p>BEEE_DATA exists: " + (typeof BEEE_DATA !== 'undefined') + "</p>";
    log.innerHTML += "<p>Original t0 mathHtml: " + (BEEE_DATA.topics[0].mathHtml.replace(/</g, '&lt;')) + "</p>";
    MathRenderer.enrichCourseData(BEEE_DATA);
    log.innerHTML += "<p>Enriched t0 mathHtml: " + (BEEE_DATA.topics[0].mathHtml.replace(/</g, '&lt;')) + "</p>";
    log.innerHTML += "<p>Enriched f0 mathHtml: " + (BEEE_DATA.masterFormulas[0].mathHtml.replace(/</g, '&lt;')) + "</p>";
  } catch (err) {
    log.innerHTML += "<p style='color:red;'>ERROR: " + err.stack + "</p>";
  }
</script>
</body>
</html>
