<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<div id="log"></div>
<script src="math_renderer.js"></script>
<script src="beee_course_data.js"></script>
<script>
  const log = document.getElementById('log');
  try {
    log.innerHTML += "<p>Starting full enrichment test...</p>";
    BEEE_DATA.topics.forEach((t, i) => {
      try {
        if (t.concept) t.conceptFormatted = MathRenderer.formatText(t.concept);
        if (t.mathHtml || t.math) t.mathHtml = MathRenderer.render(t.mathHtml || t.math);
        if (Array.isArray(t.lines)) t.linesFormatted = t.lines.map(l => MathRenderer.formatText(l));
        if (Array.isArray(t.derivationSteps)) {
          t.derivationSteps.forEach(s => {
            if (s.math) s.mathHtml = MathRenderer.render(s.math);
            if (s.text) s.textFormatted = MathRenderer.formatText(s.text);
          });
        }
        if (t.example) {
          if (t.example.problem) t.example.problemFormatted = MathRenderer.formatText(t.example.problem);
          if (t.example.solution) t.example.solutionFormatted = MathRenderer.formatText(t.example.solution);
        }
      } catch (errTopic) {
        log.innerHTML += "<p style='color:red;'>Error in topic " + i + " (" + t.id + "): " + errTopic.message + "</p>";
        throw errTopic;
      }
    });
    log.innerHTML += "<p style='color:green;'>All 32 topics enriched successfully!</p>";

    BEEE_DATA.masterFormulas.forEach((f, i) => {
      try {
        f.formula = f.formula || f.math || '';
        f.math = f.math || f.formula || '';
        if (!f.unitId) f.unitId = (f.unit && f.unit.startsWith('u')) ? f.unit : 'u1';
        if (!f.unitStr) f.unitStr = (f.unit && !f.unit.startsWith('u')) ? f.unit : 'Derived SI';
        f.unit = f.unitStr;
        f.mathHtml = MathRenderer.render(f.mathHtml || f.formula);
      } catch (errForm) {
        log.innerHTML += "<p style='color:red;'>Error in formula " + i + " (" + f.id + "): " + errForm.message + "</p>";
        throw errForm;
      }
    });
    log.innerHTML += "<p style='color:green;'>All 26 formulas enriched successfully!</p>";

    log.innerHTML += "<p>Topic 0 rendered: " + BEEE_DATA.topics[0].mathHtml.replace(/</g, '&lt;') + "</p>";
    log.innerHTML += "<p>Topic 5 rendered: " + BEEE_DATA.topics[5].mathHtml.replace(/</g, '&lt;') + "</p>";
    log.innerHTML += "<p>Has raw text in t0: " + BEEE_DATA.topics[0].mathHtml.includes('\\text') + "</p>";
  } catch (err) {
    log.innerHTML += "<p style='color:red;'>FATAL ERROR: " + err.stack + "</p>";
  }
</script>
</body>
</html>
